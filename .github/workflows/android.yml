name: Build Pixel Guardian
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle lintDebug testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-guardian-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload quality reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-quality-reports
          path: |
            app/build/reports/**
            app/build/intermediates/lint_intermediate_text_report/**
          if-no-files-found: warn
